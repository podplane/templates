{{- if eq .Values.certificates.server "sidecar" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.name" . }}-caddy-configmap
  labels:
    {{- include "web.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
      auto_https off
      {{- if .Values.metrics }}
      {{- if .Values.metrics.http }}
      metrics
      {{- end }}
      {{- end }}
    }
    :443 {
      tls /etc/caddy/certs/tls.crt /etc/caddy/certs/tls.key
      reverse_proxy 127.0.0.1:{{ include "web.primaryPort" . }}
    }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.name" . }}-deployment
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "web.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: {{ printf "%s-container" (include "web.name" .) | quote }}
      labels:
        {{- include "web.selectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.secrets .Values.serviceAccount.name }}
      serviceAccountName: {{ include "web.serviceAccountName" . }}
      {{- end }}
      securityContext:
        fsGroup: 65532
      containers:
        - name: {{ include "web.name" . }}-container
          image: {{ .Values.images.app | quote }}
          {{- with .Values.app.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          {{- if or .Values.secrets .Values.certificates.client (eq .Values.certificates.server "direct") }}
          volumeMounts:
            {{- if eq .Values.certificates.server "direct" }}
            - name: {{ include "web.name" . }}-service-certificate
              mountPath: /var/run/secrets/podplane/server-certificate
              readOnly: true
            {{- end }}
            {{- if .Values.certificates.client }}
            - name: {{ include "web.name" . }}-client-certificate
              mountPath: /var/run/secrets/podplane/client-certificate
              readOnly: true
            {{- end }}
            {{- range $index, $secret := .Values.secrets }}
            - name: {{ printf "%s-secrets-store-%d" (include "web.name" $) $index }}
              mountPath: {{ required (printf "secrets[%d].mountPath is required" $index) $secret.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- if eq .Values.certificates.server "sidecar" }}
        - name: {{ include "web.name" . }}-caddy
          image: {{ .Values.images.caddy | quote }}
          ports:
            - containerPort: 443
            {{- if .Values.metrics }}
            {{- if .Values.metrics.http }}
            - containerPort: 2019
            {{- end }}
            {{- end }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          volumeMounts:
            - name: {{ include "web.name" . }}-service-certificate
              mountPath: /etc/caddy/certs
              readOnly: true
            - name: {{ include "web.name" . }}-caddy-config-volume
              mountPath: /etc/caddy
        {{- end }}
      volumes:
        {{- range $index, $secret := .Values.secrets }}
        - name: {{ printf "%s-secrets-store-%d" (include "web.name" $) $index }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required (printf "secrets[%d].bindingName is required" $index) $secret.bindingName | quote }}
        {{- end }}
        - name: {{ include "web.name" . }}-service-certificate
          {{- if not .Values.certificates.secrets }}
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: "platform-service-certificate-clusterissuer"
              csi.cert-manager.io/issuer-kind: "ClusterIssuer"
              csi.cert-manager.io/dns-names: {{ include "web.serverCertificateDNSNames" . | quote }}
              csi.cert-manager.io/key-usages: "digital signature,server auth"
              csi.cert-manager.io/certificate-file: tls.crt
              csi.cert-manager.io/privatekey-file: tls.key
              csi.cert-manager.io/ca-file: ca.crt
              csi.cert-manager.io/fs-group: "65532"
          {{- else }}
          secret:
            secretName: {{ include "web.serverCertificateSecretName" . }}
          {{- end }}
        {{- if .Values.certificates.client }}
        - name: {{ include "web.name" . }}-client-certificate
          {{- if not .Values.certificates.secrets }}
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: "platform-service-certificate-clusterissuer"
              csi.cert-manager.io/issuer-kind: "ClusterIssuer"
              csi.cert-manager.io/dns-names: {{ include "web.clientCertificateDNSName" . | quote }}
              csi.cert-manager.io/key-usages: "digital signature,client auth"
              csi.cert-manager.io/certificate-file: tls.crt
              csi.cert-manager.io/privatekey-file: tls.key
              csi.cert-manager.io/ca-file: ca.crt
              csi.cert-manager.io/fs-group: "65532"
          {{- else }}
          secret:
            secretName: {{ include "web.clientCertificateSecretName" . }}
          {{- end }}
        {{- end }}
        {{- if eq .Values.certificates.server "sidecar" }}
        - name: {{ include "web.name" . }}-caddy-config-volume
          configMap:
            name: {{ include "web.name" . }}-caddy-configmap
        {{- end }}
