{{- if eq .Values.certificates.server "sidecar" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.name" . }}-envoy-configmap
  labels:
    {{- include "web.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    node:
      id: {{ include "web.name" . }}-sidecar
      cluster: podplane-web
    overload_manager:
      resource_monitors:
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 1024
    static_resources:
      listeners:
        - name: https
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: service-certificate
                        sds_config:
                          resource_api_version: V3
                          path_config_source:
                            path: /etc/envoy/server-certificate.yaml
                            watched_directory:
                              path: /etc/envoy
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: local_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: local_service
                                timeout: 0s
                    upgrade_configs:
                      - upgrade_type: websocket
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: local_service
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: local_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ include "web.primaryPort" . }}
  server-certificate.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: service-certificate
        tls_certificate:
          certificate_chain:
            filename: /var/run/secrets/podplane/server-certificate/credential-bundle.pem
          private_key:
            filename: /var/run/secrets/podplane/server-certificate/credential-bundle.pem
          watched_directory:
            path: /var/run/secrets/podplane/server-certificate
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.name" . }}-deployment
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "web.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: {{ printf "%s-container" (include "web.name" .) | quote }}
      labels:
        {{- include "web.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "web.serviceAccountName" . }}
      securityContext:
        fsGroup: 65532
      containers:
        - name: {{ include "web.name" . }}-container
          image: {{ .Values.images.app | quote }}
          {{- with .Values.app.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          {{- if or .Values.secrets .Values.certificates.client (eq .Values.certificates.server "direct") }}
          volumeMounts:
            {{- if eq .Values.certificates.server "direct" }}
            - name: {{ include "web.name" . }}-service-certificate
              mountPath: /var/run/secrets/podplane/server-certificate
              readOnly: true
            {{- end }}
            {{- if .Values.certificates.client }}
            - name: {{ include "web.name" . }}-client-certificate
              mountPath: /var/run/secrets/podplane/client-certificate
              readOnly: true
            {{- end }}
            {{- range $index, $secret := .Values.secrets }}
            - name: {{ printf "%s-secrets-store-%d" (include "web.name" $) $index }}
              mountPath: {{ required (printf "secrets[%d].mountPath is required" $index) $secret.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- if eq .Values.certificates.server "sidecar" }}
        - name: {{ include "web.name" . }}-envoy
          image: {{ .Values.images.envoy | quote }}
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --disable-hot-restart
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          volumeMounts:
            - name: {{ include "web.name" . }}-service-certificate
              mountPath: /var/run/secrets/podplane/server-certificate
              readOnly: true
            - name: {{ include "web.name" . }}-envoy-config-volume
              mountPath: /etc/envoy
              readOnly: true
        {{- end }}
      volumes:
        {{- range $index, $secret := .Values.secrets }}
        - name: {{ printf "%s-secrets-store-%d" (include "web.name" $) $index }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required (printf "secrets[%d].bindingName is required" $index) $secret.bindingName | quote }}
        {{- end }}
        - name: {{ include "web.name" . }}-service-certificate
          projected:
            sources:
              - podCertificate:
                  signerName: certificates.podplane.dev/workload
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
                  userAnnotations:
                    certificates.podplane.dev/mode: service
                    certificates.podplane.dev/service: {{ include "web.name" . }}-service
        {{- if .Values.certificates.client }}
        - name: {{ include "web.name" . }}-client-certificate
          projected:
            sources:
              - podCertificate:
                  signerName: certificates.podplane.dev/workload
                  keyType: ED25519
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: certificates.podplane.dev/workload
                  labelSelector: {}
                  path: trust-bundle.pem
        {{- end }}
        {{- if eq .Values.certificates.server "sidecar" }}
        - name: {{ include "web.name" . }}-envoy-config-volume
          configMap:
            name: {{ include "web.name" . }}-envoy-configmap
        {{- end }}
